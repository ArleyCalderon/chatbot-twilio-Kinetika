<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Panel" }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/panel.css') }}">

  {% block extra_css %}{% endblock %}
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/panel">Panel Asesores</a>

      {% if user %}
      <div class="d-flex align-items-center gap-3">
      <a class="text-white text-decoration-none" href="/panel">Chats</a>

      {% if user == "Admin" %}
        <a class="text-white text-decoration-none" href="/assistants">Asistentes</a>
        <a class="text-white text-decoration-none" href="/settings">Configuración</a>
      {% endif %}
      </div>
      {% endif %}

      <div class="ms-auto d-flex align-items-center gap-3">
        {% if user %}
          <span class="text-white-50 small">👤 {{ user }}</span>
          <a class="btn btn-sm btn-outline-light" href="/panel/logout">Salir</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
